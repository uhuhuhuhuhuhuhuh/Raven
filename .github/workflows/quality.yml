name: Raven Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit, provider, and cache tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /Raven/
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        working-directory: frontend
        run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Python syntax check
        run: python -m py_compile server/main.py
      - name: FastAPI health and provider smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from server.main import app
          client = TestClient(app)
          response = client.get('/api/health')
          assert response.status_code == 200, response.text
          payload = response.json()
          assert payload['service'] == 'raven'
          assert payload['version'] == '1.1.0'
          providers = client.get('/api/providers')
          assert providers.status_code == 200, providers.text
          ids = {item['id'] for item in providers.json()['providers']}
          assert {'osm-overpass', 'fl511-public-cameras', 'caltrans-cctv'} <= ids
          PY
      - name: Launcher syntax check
        run: bash -n scripts/run-local.sh
