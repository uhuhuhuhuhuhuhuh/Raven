name: Raven Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit and state tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /Raven/
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        working-directory: frontend
        run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Python syntax check
        run: python -m py_compile server/main.py
      - name: FastAPI health smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from server.main import app
          response = TestClient(app).get('/api/health')
          assert response.status_code == 200, response.text
          payload = response.json()
          assert payload['service'] == 'raven'
          assert payload['version'] == '1.0.0'
          PY
      - name: Launcher syntax check
        run: bash -n scripts/run-local.sh
