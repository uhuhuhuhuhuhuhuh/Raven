name: Deploy Raven to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily redeploy keeps the published camera/stream catalog (api/v1) current.
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit, provider, and cache tests
        working-directory: frontend
        run: npm test
      - name: Build GitHub Pages edition
        working-directory: frontend
        env:
          VITE_BASE_PATH: /Raven/
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Week stamp for the OpenStreetMap extract
        id: osm-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore OpenStreetMap camera tiles
        id: osm-cache
        uses: actions/cache@v4
        with:
          path: osm-tiles
          key: osm-tiles-us-${{ steps.osm-week.outputs.week }}
          restore-keys: osm-tiles-us-
      # Geofabrik's US extract (~11 GB) is streamed through osmium so only camera nodes
      # touch the disk, and fetched at most once a week thanks to the cache above. If this
      # fails the site ships last week's tiles, or none, and the map queries Overpass.
      - name: Build OpenStreetMap camera tiles from the Geofabrik US extract
        if: steps.osm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends osmium-tool
          python -m pip install -r scripts/requirements-osm.txt
          scripts/fetch-geofabrik-cameras.sh north-america/us "$RUNNER_TEMP/osm"
          # osm-tiles holds last week's build when the cache restored one, so changes.json diffs against it.
          python scripts/build_osm_tiles.py --pbf "$RUNNER_TEMP/osm/cameras.osm.pbf" --poly "$RUNNER_TEMP/osm/region.poly" \
            --source "Geofabrik north-america/us" --out "$RUNNER_TEMP/osm-tiles" \
            --previous osm-tiles --site-url "${{ steps.pages.outputs.base_url }}"
          rm -rf osm-tiles && mv "$RUNNER_TEMP/osm-tiles" osm-tiles
      - name: Publish OpenStreetMap camera tiles with the site
        run: |
          if [ -f osm-tiles/index.json ]; then
            mkdir -p frontend/dist/api/v1 && cp -r osm-tiles frontend/dist/api/v1/osm
          else
            echo "::warning::No OpenStreetMap extract tiles available; the map will query Overpass."
          fi
      - name: Build static camera/stream API
        working-directory: frontend
        run: npm run build:api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
